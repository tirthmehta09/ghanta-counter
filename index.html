<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<title>108 Ghanta Counter</title>
<style>
  :root { --bg:#efe6d6; --fg:#2b2118; --muted:#7a6a58; --accent:#2f6b4f; --card:#faf5ea; --line:#d8c9ad; color-scheme:light; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; padding:16px; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; gap:16px; }
  h1 { margin:8px 0 0; font-family:Georgia,serif; font-size:24px; font-weight:600; text-align:center; }
  .video { width:min(100%,640px); aspect-ratio:16/9; background:#000; border-radius:16px; overflow:hidden; }
  .video iframe { width:100%; height:100%; border:0; }
  .card { width:min(100%,640px); background:var(--card); border:1px solid var(--line); border-radius:22px; padding:20px; text-align:center; box-sizing:border-box; }
  #count { font-family:Georgia,serif; font-size:clamp(72px,24vw,120px); font-weight:700; color:var(--accent); line-height:1.1; font-variant-numeric:tabular-nums; }
  #progress { font-size:18px; color:var(--muted); }
  #status { font-size:14px; color:var(--muted); margin-top:10px; }
</style>
</head>
<body>
<h1>108 Ghanta Counter</h1>
<div class="video">
  <iframe src="https://www.youtube.com/embed/pkZ41J_5e5Y" title="YouTube live" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
</div>
<div class="card">
  <div id="count">0</div>
  <div id="progress">Bells: 0 / 108</div>
  <div id="status">Connecting…</div>
</div>
<script>
(() => {
  const TOTAL = 108;
  const countEl = document.getElementById('count');
  const progressEl = document.getElementById('progress');
  const statusEl = document.getElementById('status');

  async function load() {
    try {
      const r = await fetch('/api/state', { cache: 'no-store' });
      const s = await r.json();
      countEl.textContent = s.count;
      progressEl.textContent = `Bells: ${s.played} / ${TOTAL}`;
      statusEl.textContent = s.running ? 'Live' : 'Count is saved';
    } catch (e) {
      statusEl.textContent = 'Reconnecting…';
    }
  }
  load();
  setInterval(load, 1000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
})();
</script>
</body>
</html>

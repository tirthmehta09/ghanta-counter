<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<title>108 Ghantakarn Mahavir Havan Ghanta</title>
<style>
  :root { --bg:#efe6d6; --fg:#2b2118; --muted:#7a6a58; --accent:#2f6b4f; --card:#faf5ea; --line:#d8c9ad; color-scheme:light; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; padding:16px; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; gap:16px; }
  h1 { margin:8px 0 0; font-family:Georgia,serif; font-size:24px; font-weight:600; text-align:center; }
  .video { width:min(100%,640px); aspect-ratio:16/9; background:#000; border-radius:16px; overflow:hidden; }
  .video iframe { width:100%; height:100%; border:0; }
  .card { width:min(100%,640px); background:var(--card); border:1px solid var(--line); border-radius:22px; padding:20px; text-align:center; box-sizing:border-box; }
  #count { font-family:Georgia,serif; font-size:clamp(72px,24vw,120px); font-weight:700; color:var(--accent); line-height:1.1; font-variant-numeric:tabular-nums; }
  #progress { font-size:18px; color:var(--muted); }
  #status { font-size:14px; color:var(--muted); margin-top:10px; }
  button.top { margin:0 0 4px; background:var(--accent); color:var(--card); border:none; border-radius:12px; padding:10px 20px; font-size:16px; cursor:pointer; }
  [hidden] { display:none !important; }
  #banner { position:fixed; top:0; left:0; right:0; z-index:100; padding:18px 12px; text-align:center; font-family:Georgia,serif; font-size:clamp(20px,6vw,30px); font-weight:700; color:#2b1a05; background:linear-gradient(90deg,#f5c542,#fff1b8,#f5c542,#fff1b8); background-size:300% 100%; animation:shine 3s linear infinite, drop .6s ease-out; box-shadow:0 6px 24px rgba(0,0,0,.25); }
  @keyframes shine { from { background-position:0 0; } to { background-position:300% 0; } }
  @keyframes drop { from { transform:translateY(-100%); } to { transform:translateY(0); } }
</style>
</head>
<body>
<div id="banner" hidden>Shree Ghantakaran Mahavir Dev ni Jay</div>
<button id="installBtn" class="top">Download App</button>
<h1>108 Ghantakarn Mahavir Havan Ghanta</h1>
<div class="video">
  <iframe src="https://www.youtube.com/embed/pkZ41J_5e5Y" title="YouTube live" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
</div>
<div class="card">
  <div id="count">0</div>
  <div id="progress">Bells: 0 / 108</div>
  <div id="status">Connecting…</div>
</div>
<script>
(() => {
  const TOTAL = 108;
  const countEl = document.getElementById('count');
  const progressEl = document.getElementById('progress');
  const statusEl = document.getElementById('status');

  async function load() {
    try {
      const r = await fetch('/api/state', { cache: 'no-store' });
      const s = await r.json();
      countEl.textContent = s.count;
      const fmt = (ts) => ts ? new Date(ts).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true }) : '—';
      let html = `Started: ${fmt(s.startedAt)}<br>108 reached: ${fmt(s.doneAt)}`;
      if (s.count >= TOTAL) html += '<br><b>Shree Ghantakaran Mahavir Dev ni Jay</b>';
      progressEl.innerHTML = html;
      document.getElementById('banner').hidden = !(s.count >= TOTAL);
      statusEl.textContent = s.running ? 'Live' : 'Count is saved';
    } catch (e) {
      statusEl.textContent = 'Reconnecting…';
    }
  }
  load();
  setInterval(load, 1000);
  let deferredPrompt = null;
  const installBtn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
  installBtn.addEventListener('click', async () => {
    if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; return; }
    document.getElementById('status').textContent = 'Chrome: tap the ⋮ menu, then "Install app". iPhone: tap Share, then "Add to Home Screen".';
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
})();
</script>
</body>
</html>
